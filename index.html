<body>
<style>
  @font-face { font-family: "Mix Tumble"; src: url("fonts/MixTumble.otf") format("opentype"); font-display: block; }
  @font-face { font-family: "Garet"; src: url("fonts/Garet-Book.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Garet"; src: url("fonts/Garet-Heavy.woff2") format("woff2"); font-weight: 800; font-display: swap; }
  @font-face { font-family: "Dudu Calligraphy"; src: url("fonts/DuduCalligraphy.woff2") format("woff2"); font-display: swap; }
  /* Layout: name and slogan on the left; on the right, a rendered isometric study that turns towards its window and is the whole menu.
     Clicking a piece brings it forward as a close-up. Palette from the references: olive stripes, walnut, oxblood, mustard, madder, navy, cream. */
  :root {
    --bg: #efe6d4; --bg-deep: #d9c7a5; --ink: #2b1e16; --ink-soft: #5a4636; --title: #7e2a22; --accent: #d6a845;
    --card: #f6eedd; --btn-ink: #2b1e16; --pen: #2c4677; --red-pencil: #9c3a2d;
    --display: "Mix Tumble", "Garet", "Marker Felt", cursive; --body: "Garet", "Avenir Next", "Segoe UI", system-ui, sans-serif; --hand: "Dudu Calligraphy", "Segoe Print", cursive;
    color-scheme: light;
  }
  :root[data-mode="night"] { --bg: #241917; --bg-deep: #0f0a09; --ink: #efe3cc; --ink-soft: #c9b394; --title: #e0a25a; --card: #2e2220; --btn-ink: #efe3cc; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(110% 90% at 70% 52%, var(--bg) 0%, var(--bg) 40%, var(--bg-deep) 100%); color: var(--ink); font-family: var(--body); overflow: hidden; transition: background 1.2s ease, color 1.2s ease; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60; opacity: 0.22; mix-blend-mode: multiply; background-image: var(--grain); }
  :root[data-mode="night"] body::after { mix-blend-mode: soft-light; opacity: 0.35; }

  .wrap { position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.3fr); }
  .intro { align-self: center; padding: 96px 16px 32px max(clamp(24px, 5vw, 88px), env(safe-area-inset-left, 0px)); position: relative; z-index: 3; }
  .name { font: 400 clamp(3rem, min(6.4vw, 11.2vh), 7.4rem)/1.15 var(--display); margin: 0; padding: 0.22em 0.08em 0.34em 0.06em; white-space: nowrap; }
  .role { font: 400 clamp(1.25rem, min(2.1vw, 3.6vh), 2.3rem)/1.15 var(--display); margin: 0 0 0.35rem; padding: 0.2em 0.06em 0.05em; color: var(--title); white-space: nowrap; }
  .slogan { font-size: clamp(1rem, 1.2vw, 1.18rem); line-height: 1.6; max-width: 25rem; margin: 0; color: var(--ink-soft); }
  .load { display: none; margin-top: 1rem; height: 2px; width: 160px; background: color-mix(in srgb, var(--ink) 15%, transparent); overflow: hidden; }
  .load i { display: block; height: 100%; width: 0; background: var(--title); transition: width 0.3s; }

  .stagebox { position: relative; margin: calc(env(safe-area-inset-top, 0px) + 92px) 96px 20px 0; }
  #room { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
  #room.drag { cursor: grabbing; } #room.over { cursor: pointer; }

  .top { position: fixed; z-index: 20; top: calc(env(safe-area-inset-top, 0px) + 22px); right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 18px; }
  .nav { display: flex; gap: 8px; }
  .nav button, .menu-btn, .btn { font: 800 0.72rem/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--btn-ink); background: color-mix(in srgb, var(--card) 70%, transparent); border: 1.5px solid var(--btn-ink); padding: 12px 14px; min-height: 44px; cursor: pointer; transition: background 0.25s, color 0.25s; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .nav button:hover, .nav button[aria-current="true"] { background: var(--accent); color: #2b1e16; border-color: #2b1e16; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--title); outline-offset: 3px; }
  .menu-btn { display: none; }
  .mode { width: 54px; height: 104px; border-radius: 28px; border: 1.5px solid var(--btn-ink); background: color-mix(in srgb, var(--card) 70%, transparent); display: grid; grid-template-rows: 1fr 1fr; padding: 4px; cursor: pointer; color: var(--btn-ink); position: relative; }
  .mode span { display: grid; place-items: center; position: relative; z-index: 1; }
  .mode .knob { position: absolute; left: 4px; right: 4px; top: 4px; height: calc(50% - 4px); border-radius: 24px; background: var(--accent); transition: transform 0.6s cubic-bezier(0.6, 0, 0.2, 1), background 0.6s; }
  :root[data-mode="night"] .mode .knob { transform: translateY(100%); background: #b9c9cf; }
  .mode svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; }

  .hnote { position: fixed; z-index: 25; pointer-events: none; padding: 8px 14px 9px; background: #f6ecd6; color: #7e2a22; font: 800 0.92rem/1.2 var(--body); letter-spacing: 0.01em; white-space: nowrap; transform-origin: 50% 100%; text-align: center;
    clip-path: polygon(0 4%, 9% 0, 22% 3%, 38% 0, 55% 4%, 71% 0, 86% 3%, 100% 0, 98% 30%, 100% 62%, 97% 100%, 78% 96%, 60% 100%, 41% 97%, 24% 100%, 6% 96%, 2% 100%, 0 70%, 3% 38%); filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.35)); }
  .hnote small { display: block; font: 400 0.98rem/1.2 var(--hand); color: var(--pen); margin: 3px 0 0; letter-spacing: 0; }
  /* touch screens: a soft pulsing ring on every piece that opens */
  /* the ghost hand: shows once, on load, that the room can be dragged round */
  .ghost { position: absolute; z-index: 4; left: 0; top: 0; width: 64px; height: 64px; margin: -10px 0 0 -26px; pointer-events: none; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35)); }
  .ghost svg { width: 100%; height: 100%; } .ghost path { fill: rgba(255, 249, 236, 0.92); stroke: #2b1e16; stroke-width: 0.9; stroke-linejoin: round; }
  .ghost .rip { position: absolute; left: 22px; top: 6px; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; border: 2px solid rgba(255, 249, 236, 0.9); opacity: 0; }
  @media (max-width: 860px) { .ghost { width: 50px; height: 50px; margin: -8px 0 0 -20px; } }
  .spots { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .spot { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: rgba(255, 226, 160, 0.92); animation: ping 2.2s ease-out infinite; transition: opacity 0.3s; --pr: 18px; }
  .spot::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #7e2a22; }
  @media (max-width: 860px) { .spot { width: 14px; height: 14px; margin: -7px 0 0 -7px; --pr: 11px; } .spot::after { inset: 4.5px; } }
  /* the turning arrow under the room: tap or click either end to turn it; it sways to show it can */
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255, 214, 140, 0.8), 0 2px 6px rgba(0, 0, 0, 0.4); } 70%, 100% { box-shadow: 0 0 0 var(--pr) rgba(255, 214, 140, 0), 0 2px 6px rgba(0, 0, 0, 0.4); } }

  /* ---------- close-ups ---------- */
  .closeup { position: fixed; inset: 0; z-index: 40; overflow: auto; overscroll-behavior: contain; padding: calc(env(safe-area-inset-top, 0px) + 120px) max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
  .closeup[hidden] { display: none; }
  .scrim { position: fixed; inset: 0; background: radial-gradient(90% 90% at 50% 45%, rgba(30, 18, 12, 0.55), rgba(12, 7, 5, 0.86)); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }
  .cu-bar { position: absolute; z-index: 44; top: calc(env(safe-area-inset-top, 0px) + 30px); align-items: flex-start; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 12px; pointer-events: none; }
  .cu-bar > * { pointer-events: auto; }
  .cu-title { margin: 0; max-width: calc(100% - 220px); padding: 0.3em 0.2em 0.05em 0.25em; font: 400 clamp(2rem, 4.4vw, 3.4rem)/1.1 var(--display); color: #f6ead2; text-shadow: 0 3px 14px rgba(0, 0, 0, 0.55); }
  /* the button's middle lines up with the middle of the section title beside it; on wider screens it scrolls away with the title, on phones it stays pinned */
  @media (min-width: 861px) { .cu-close { position: absolute !important; } }
  .cu-close { position: fixed; z-index: 45; top: var(--bt, calc(env(safe-area-inset-top, 0px) + 8px + clamp(2rem, 4.4vw, 3.4rem) * 0.9)); right: max(16px, env(safe-area-inset-right, 0px)); background: #f6ecd6; color: #2b1e16; border-color: #2b1e16; }
  .sheet { position: relative; z-index: 41; margin: 0 auto; width: min(1400px, 100%); }
  .shelf-back { position: fixed; z-index: 44; top: calc(var(--bt, 60px) + 60px); right: max(16px, env(safe-area-inset-right, 0px)); background: #2b1e16; color: #f6ecd6; border-color: #f6ecd6; }
  .hero { display: block; width: 100%; height: auto; filter: drop-shadow(0 40px 40px rgba(0, 0, 0, 0.55)); will-change: transform; }

  /* pinboard: sized to fit the screen with a margin all round; a "reach out" strip across the top, then a 3 x 3 grid:
     six sticky notes, then industries and languages as enamel pins, and education on a neat index card */
  /* the board picture has an empty border of about 5%: it may tuck under the title area, so the visible frame is as large as the screen allows */
  .pin { position: relative; width: min(1400px, 100%, calc((100svh - 92px) / 0.952 * 1.143)); margin: -48px auto 0; container-type: inline-size; }
  @media (min-width: 861px) { .closeup.noscroll { overflow: hidden; } }
  .pin .area { position: absolute; left: 8.3%; top: 10%; width: 83.4%; height: 80%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto minmax(0, 0.94fr) minmax(0, 0.94fr) minmax(0, 1.12fr); gap: 2.2% 3%; padding: 1.6% 3.2% 2.6%; box-sizing: border-box; }
  .pnote { position: relative; margin: 0; background: var(--c, #f6ecd6); color: #2b1e16; padding: 2.6cqw 2.2cqw 1.6cqw; transform: rotate(var(--r, 0deg)); box-shadow: 0 12px 16px -9px rgba(0, 0, 0, 0.6); overflow: hidden; }
  .pnote::before { content: ""; position: absolute; top: 0.7cqw; left: 50%; width: 1.2cqw; height: 1.2cqw; margin-left: -0.6cqw; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--pin, #e46a52), #5a1a12); box-shadow: 0 2px 2px rgba(0, 0, 0, 0.4); }
  .pnote h3 { font: 400 2.4cqw/1.05 var(--display); margin: 0 0 0.9cqw; padding-top: 0.15em; color: #3a2418; }
  .pnote ul { margin: 0; padding: 0; list-style: none; font: 1.65cqw/1.25 var(--hand); color: var(--pen); display: grid; gap: 0.55cqw; }
  .pnote li { padding-left: 1.1em; text-indent: -1.1em; } .pnote li::before { content: "– "; }
  .reach { grid-column: 1 / -1; justify-self: center; margin: 0; padding: 1cqw 3.4cqw 0.8cqw; background: #efe2c2; font: 400 2.7cqw/1.1 var(--display); color: #7e2a22; transform: rotate(-0.8deg); box-shadow: 0 10px 14px -9px rgba(0, 0, 0, 0.6); position: relative; }
  .reach::before, .reach::after { content: ""; position: absolute; top: -0.6cqw; width: 4.5cqw; height: 1.6cqw; background: rgba(240, 228, 196, 0.75); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15); }
  .reach::before { left: -1.4cqw; transform: rotate(-24deg); } .reach::after { right: -1.4cqw; transform: rotate(24deg); }
  /* industries and languages: a title on a paper slip, then round enamel pins with a label beneath each */
  .pins { display: grid; align-content: center; justify-items: center; gap: 0.5cqw; }
  .slip { margin: 0; padding: 0.5cqw 1.6cqw 0.3cqw; background: #f6ecd6; font: 400 2.2cqw/1.1 var(--display); color: #3a2418; transform: rotate(-1.5deg); box-shadow: 0 6px 10px -6px rgba(0, 0, 0, 0.6); }
  .pins ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.55cqw 0.5cqw; }
  .pins li { width: 7.2cqw; display: grid; justify-items: center; align-content: start; gap: 0.35cqw; text-align: center; }
  /* metal lapel pins: an enamel shape with a polished gold rim */
  .lapel { display: block; width: 5.6cqw; height: 5.6cqw; filter: drop-shadow(0 0.35cqw 0.3cqw rgba(0, 0, 0, 0.5)) drop-shadow(0 0.08cqw 0 rgba(0, 0, 0, 0.35)); }
  .lapel svg { width: 100%; height: 100%; overflow: visible; }
  .lapel .en { fill: var(--b); stroke: url(#gilt) #c9a24a; stroke-width: 2.2; stroke-linejoin: round; }
  .lapel .gl { fill: url(#gloss); pointer-events: none; } .lapel .mt { fill: url(#gilt) #c9a24a; } .lapel .ln { fill: none; stroke: url(#gilt) #c9a24a; stroke-width: 2.4; stroke-linecap: round; }
  .lapel.flag { width: 4.8cqw; height: 4.8cqw; }
  /* paper luggage tags for the names */
  .tag { position: relative; display: inline-block; max-width: 100%; box-sizing: border-box; padding: 0.3cqw 0.6cqw 0.25cqw 1.25cqw; font: 400 max(9.5px, 0.92cqw)/1.15 var(--body); color: #2b1e16; background: #efe0bf;
    clip-path: polygon(0.55cqw 0, 100% 0, 100% 100%, 0.55cqw 100%, 0 50%); transform: rotate(var(--t, -2deg)); filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.35)); }
  .tag::before { content: ""; position: absolute; left: 0.5cqw; top: 50%; width: 0.4cqw; height: 0.4cqw; margin-top: -0.2cqw; border-radius: 50%; background: #8a6a3e; box-shadow: inset 0 0 0 0.08cqw #5a4026; }
  .pins li:nth-child(even) .tag { --t: 2deg; }
  /* education: a clean index card */
  .card { position: relative; margin: 0; background: #fbf6ea; padding: 2.2cqw 1.8cqw 1cqw; transform: rotate(0.8deg); box-shadow: 0 12px 16px -9px rgba(0, 0, 0, 0.6);
    background-image: linear-gradient(transparent 4.6cqw, rgba(156, 58, 45, 0.45) 4.6cqw, rgba(156, 58, 45, 0.45) calc(4.6cqw + 1px), transparent calc(4.6cqw + 1px)); }
  .card::before { content: ""; position: absolute; top: 0.7cqw; left: 50%; width: 1.2cqw; height: 1.2cqw; margin-left: -0.6cqw; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #d9b25a, #6a4e1a); box-shadow: 0 2px 2px rgba(0, 0, 0, 0.4); }
  .card h3 { margin: 0 0 0.9cqw; font: 400 2.2cqw/1.05 var(--display); color: #3a2418; padding-top: 0.1em; }
  .card dl { margin: 0; display: grid; gap: 0.5cqw; } .card dt { font: 800 max(9.5px, 1.02cqw)/1.2 var(--body); color: #2b1e16; } .card dd { margin: 0; font: 1.3cqw/1.15 var(--hand); color: var(--pen); }

  /* chest */
  .chestwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 30px; align-items: center; }
  .chestimg { position: relative; }
  .chestimg img { position: absolute; inset: 0; width: 100%; height: auto; }
  .chestimg img:first-child { position: relative; }
  .pullbtn { margin-top: 14px; font: 1.5rem/1 var(--hand); color: #f6ead2; background: none; border: 1.5px dashed rgba(246, 234, 210, 0.6); padding: 12px 20px; cursor: pointer; min-height: 44px; border-radius: 40px; }
  .tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tgroup { background: #f2e8d2; padding: 12px 12px 14px; border-top: 6px solid var(--tab); box-shadow: 0 16px 24px -14px rgba(0, 0, 0, 0.8); }
  .tgroup h4 { margin: 0 0 8px; font: 800 0.68rem/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: #2b1e16; }
  .tgroup ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
  .tgroup li { background: #fff; padding: 6px; box-shadow: 0 3px 6px -3px rgba(0, 0, 0, 0.4); }
  .tgroup img { display: block; height: 40px; width: auto; max-width: 110px; object-fit: contain; }
  .tools-lead { color: #f6ead2; font: 1.5rem/1.2 var(--hand); margin: 0 0 14px; }

  /* the five case books, as real covers in 3D; each has its result on a paper note beneath */
  .shelfrow { display: flex; justify-content: center; align-items: center; gap: clamp(14px, 2.4vw, 44px); flex-wrap: nowrap; perspective: 1600px; padding: 10px 0 30px; min-height: calc(100svh - 168px); box-sizing: border-box; }
  .bk { display: grid; justify-items: center; gap: 26px; }
  .cbook { position: relative; width: clamp(110px, 13.2vw, 230px); aspect-ratio: 0.7; border: none; padding: 0; background: none; cursor: pointer; transform-style: preserve-3d; transform: rotateY(-22deg) rotateX(4deg); }
  .cbook .cover, .cbook .spine, .cbook .pages { position: absolute; backface-visibility: hidden; }
  .cbook .cover { inset: 0; background-size: cover; border-radius: 2px 6px 6px 2px; box-shadow: inset 4px 0 6px rgba(0, 0, 0, 0.35), 0 30px 30px -18px rgba(0, 0, 0, 0.8); }
  .cbook .spine { top: 0; bottom: 0; left: 0; width: 18%; transform-origin: 0 50%; transform: rotateY(90deg); background-size: cover; }
  .cbook .pages { top: 2%; bottom: 2%; right: 0; width: 16%; transform-origin: 100% 50%; transform: rotateY(90deg) translateX(100%); background: repeating-linear-gradient(90deg, #f3ead4 0 2px, #d9cba8 2px 3px); }
  .res { width: clamp(110px, 13.2vw, 220px); background: #f6ecd6 var(--papertex); color: #2b1e16; padding: 14px 14px 12px; text-align: center; transform: rotate(var(--r)); box-shadow: 0 14px 18px -10px rgba(0, 0, 0, 0.7);
    clip-path: polygon(0 3%, 12% 0, 30% 2%, 50% 0, 70% 3%, 88% 0, 100% 2%, 99% 50%, 100% 98%, 80% 100%, 60% 97%, 40% 100%, 20% 97%, 0 100%, 1% 50%); }
  .res b { display: block; font: 800 clamp(1.8rem, 2.7vw, 2.6rem)/1.05 var(--body); color: #9c2f22; letter-spacing: -0.01em; }
  .res span { display: block; margin-top: 4px; font: 0.85rem/1.35 var(--body); color: #4a3a2c; }
  .btn { display: inline-flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; box-sizing: border-box; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 1.2rem; }
  .btn.dark { background: #2b1e16; color: #f6ecd6; border-color: #2b1e16; } .btn.lite { background: transparent; color: #2b1e16; border-color: #2b1e16; }
  /* the reader from the first site, sitting in the close-up under its title bar */
  #reader { z-index: 43; background: transparent; padding-top: calc(env(safe-area-inset-top, 0px) + 172px); grid-template-rows: minmax(0, 1fr) auto; }
  #reader .reader-top { position: fixed; top: calc(var(--bt, 60px) + 60px); right: max(16px, env(safe-area-inset-right, 0px)); padding: 0; width: auto; z-index: 45; }
  #reader .reader-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .reading #sheet { visibility: hidden; }
  #reader #closeBook { background: #2b1e16; color: #f6ecd6; border: 1.5px solid #f6ecd6; }

  /* newspaper: masthead, headline, the numbers, then the story */
  .newswrap { perspective: 1800px; }
  .paper { background: #f4ecd9 var(--papertex); color: #241a14; padding: clamp(22px, 4vw, 56px); box-shadow: 0 40px 60px -30px rgba(0, 0, 0, 0.85); transform-origin: 50% 0; }
  .mast { font: 400 clamp(2.3rem, 5.6vw, 5rem)/1.1 var(--display); text-align: center; margin: 0; padding: 0.22em 0 0; white-space: nowrap; }
  .dateline { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 3px double #241a14; border-bottom: 3px double #241a14; padding: 8px 2px; margin: 8px 0 22px; font: 800 0.7rem/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; }
  .headline { font: 400 clamp(1.7rem, 3.4vw, 2.8rem)/1.05 var(--display); margin: 0 0 12px; padding-top: 0.1em; }
  .deck { font: clamp(1rem, 1.5vw, 1.45rem)/1.3 var(--hand); color: var(--pen); margin: 0 0 20px; white-space: nowrap; }
  .cols p.sign { font-style: italic; color: var(--pen); }
  .headline, .deck { text-align: center; }

        <div id="toolsWrap" hidden><p class="tools-lead">Tools I work with, kept within reach.</p><div class="tools" id="tools">${TOOLS.map(([t, c, l]) => `<section class="tgroup" style="--tab:${c}"><h4>${t}</h4><ul>${l.map(([f, a]) => `<li><img src="img/tools/${f}.webp" alt="${a}"></li>`).join('')}</ul></section>`).join('')}</div></div></div>`,
    shelves: () => `<div class="shelfrow">${CASES.map((c, i) => `<div class="bk"><button class="cbook" type="button" data-case="${i}" aria-label="Open case ${c.num}: ${c.title}"><span class="pages"></span><span class="spine" style="background-image:url(heroes/spine${i}.webp)"></span><span class="cover" style="background-image:url(heroes/cover${i}.webp)"></span></button>
        <p class="res" style="--r:${['-2deg', '1.5deg', '-1deg', '2deg', '-1.5deg'][i]}"><b>${c.res[0]}</b><span>${c.res[1]}</span></p></div>`).join('')}</div>`,
    couch: () => `<div class="newswrap"><article class="paper" id="paper"><header><h3 class="mast">the naipak times</h3><div class="dateline"><span>Portfolio edition</span><span>${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</span></div></header>
        <h4 class="headline">good marketing is rarely the work of one brilliant idea.</h4><p class="deck">I turn complex briefs into campaigns people actually click, read and remember. From the first impression to the final click.</p>
        <div class="np-top"><figure class="portrait"><div class="fr"><img src="img/portrait.webp" alt="Portrait of Darya Naipak" width="600" height="505"></div><figcaption><b>darya naipak</b>Product Marketing Strategic Lead<br><strong>5+ years of product marketing experience</strong></figcaption></figure>
        <section class="nums" aria-label="Key results"><h4>key results</h4><div class="npnums">${NUMBERS.map(([n, d]) => `<div><b>${n}</b><span>${d}</span></div>`).join('')}</div></section></div>
        <div class="cols">${ABOUT.map((p, i) => `<p${i === ABOUT.length - 1 ? ' class="sign"' : ''}>${p}</p>`).join('')}</div></article></div>`,
    people: () => `<div class="trio">${VOICES.map((v, i) => `<figure class="vis"><div class="hello">Hello, my name is <b>${v.first.toLowerCase()}</b></div>
        <img class="hero" src="heroes/${v.id}.webp" alt="${v.name}, drawn as a small figure"><figcaption><b>${v.name.toLowerCase()}</b>${v.role}<br><button class="btn" type="button" data-say="${i}" aria-expanded="false" aria-controls="saybox">Open the testimonial</button></figcaption></figure>`).join('')}</div>
        <div class="saybox" id="saybox" hidden aria-live="polite"><p id="sayq"></p><p class="who" id="saywho"></p></div>`,
    cat: () => `<div class="catcard"><img class="hero" src="heroes/cat.webp" alt="The shop cat, a grey tabby, holding a business card in her mouth"><div class="bcard" id="bcard"><h3>darya naipak</h3><p class="ttl">product marketing strategic lead</p>
        <ul><li><a href="mailto:naipak.darya.be@gmail.com">naipak.darya.be@gmail.com</a></li><li><a href="https://www.linkedin.com/in/darya-naipak" target="_blank" rel="noopener">linkedin.com/in/darya-naipak</a></li><li><a href="tel:+32484125296">+32 484 12 52 96</a></li><li>Belgium · open to relocating and traveling</li></ul>
        <p class="story">Got a story to tell? Reach out and let’s start drafting your next product launch.</p>
        <div class="row"><button class="btn dark" type="button" id="copyMail">Copy email</button><a class="btn lite" href="https://www.linkedin.com/in/darya-naipak" target="_blank" rel="noopener">Open LinkedIn</a></div><p class="toast" id="toast" aria-live="polite"></p></div></div>`
  };
  const D = reduce ? 0 : 1;
  function enter(s, from) {
    const hero = sheet.querySelector('.hero'), tl = gsap.timeline();
    tl.fromTo('#scrim', { opacity: 0 }, { opacity: 1, duration: 0.5 * D }, 0).fromTo(['.cu-bar', '#cuClose'], { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5 * D }, 0.15 * D);
    /* the piece flies from where it stands in the room to the front */
    const target = s === 'shelves' ? sheet.querySelector('.shelfrow') : s === 'couch' ? $('#paper') : hero;
    if (target) { const r = target.getBoundingClientRect(); const sc = Math.max(0.08, Math.min(from.w / r.width, from.h / r.height));
      tl.fromTo(target, { x: from.x + from.w / 2 - (r.left + r.width / 2), y: from.y + from.h / 2 - (r.top + r.height / 2), scale: sc, opacity: 0.2, rotationX: s === 'couch' ? 60 : 0 }, { x: 0, y: 0, scale: 1, opacity: 1, rotationX: 0, duration: 1.0 * D, ease: 'expo.out' }, 0.05); }
    if (s === 'pinboard') tl.from('.pin .reach, .pin .pnote, .pin .pins, .pin .card', { opacity: 0, y: -30, rotate: (i) => (i % 2 ? 8 : -8), stagger: 0.05 * D, duration: 0.5 * D, ease: 'back.out(1.8)' }, 0.55 * D);
    if (s === 'people') tl.from('.vis', { y: 40, opacity: 0, stagger: 0.12 * D, duration: 0.7 * D, ease: 'power3.out' }, 0.1).from('.hello', { scale: 0.4, opacity: 0, transformOrigin: '50% 100%', stagger: 0.12 * D, duration: 0.5 * D, ease: 'back.out(2)' }, 0.6 * D);
    if (s === 'shelves') tl.from('.cbook', { y: 60, opacity: 0, rotationY: -60, stagger: 0.08 * D, duration: 0.8 * D, ease: 'power3.out' }, 0.2 * D).from('.res', { y: 20, opacity: 0, rotate: 0, stagger: 0.08 * D, duration: 0.6 * D, ease: 'back.out(1.6)' }, 0.6 * D);
    if (s === 'cat') tl.from('#bcard', { x: -140, y: 30, rotate: -18, scale: 0.4, opacity: 0, duration: 0.9 * D, ease: 'back.out(1.4)' }, 0.55 * D);
    if (s === 'drawer') tl.from('.pullbtn', { opacity: 0, y: 10, duration: 0.4 * D }, 0.7 * D);
  }
  function wire(s) {
    if (s === 'drawer') { const b = $('#pull'), tw = $('#toolsWrap'); let open = false;
      b.addEventListener('click', () => { open = !open; b.setAttribute('aria-expanded', String(open)); b.textContent = open ? 'Push it back' : 'Pull the top drawer';
        gsap.to('#chestOpen', { opacity: open ? 1 : 0, duration: 0.6 * D, ease: 'power2.inOut' });
        if (open) { tw.hidden = false; gsap.fromTo('.tgroup', { y: 80, opacity: 0, scale: 0.7, rotate: (i) => (i % 2 ? 6 : -6) }, { y: 0, opacity: 1, scale: 1, rotate: 0, stagger: 0.07 * D, duration: 0.7 * D, ease: 'back.out(1.5)', delay: 0.2 * D }); }
        else gsap.to('.tgroup', { y: 60, opacity: 0, scale: 0.8, stagger: 0.03 * D, duration: 0.3 * D, onComplete: () => { tw.hidden = true; } }); }); }
    if (s === 'shelves') sheet.querySelectorAll('[data-case]').forEach(b => { b.addEventListener('click', () => openCase(+b.dataset.case, b));
      b.addEventListener('pointermove', e => { const r = b.getBoundingClientRect(); gsap.to(b, { rotationY: -22 + ((e.clientX - r.left) / r.width - 0.5) * 30, rotationX: 4 - ((e.clientY - r.top) / r.height - 0.5) * 16, y: -10, duration: 0.4 }); });
      b.addEventListener('pointerleave', () => gsap.to(b, { rotationY: -22, rotationX: 4, y: 0, duration: 0.6, ease: 'power3.out' })); });
    if (s === 'people') { const box = $('#saybox'), q = $('#sayq'), who = $('#saywho'), btns = [...sheet.querySelectorAll('[data-say]')]; let cur = -1;
      btns.forEach(b => b.addEventListener('click', () => { const i = +b.dataset.say, v = VOICES[i];
        btns.forEach(x => { x.setAttribute('aria-expanded', 'false'); x.textContent = 'Open the testimonial'; });
        if (cur === i) { cur = -1; gsap.to(box, { opacity: 0, y: -10, duration: 0.3 * D, onComplete: () => { if (cur < 0) box.hidden = true; } }); return; }
        const was = cur; cur = i; b.setAttribute('aria-expanded', 'true'); b.textContent = 'Close the testimonial';
        const fill = () => { q.textContent = `“${v.quote}”`; who.textContent = `${v.name}, ${v.role}`; };
        /* phones: the figures stack, so the bubble opens right under the person who is speaking; wider screens: one bubble under all three */
        const vis = b.closest('.vis'), narrow = innerWidth < 861, home = narrow ? vis : sheet.querySelector('.trio');
        if (box.previousElementSibling !== home) { home.after(box); if (was >= 0) { fill(); box.hidden = false; gsap.fromTo(box, { opacity: 0, y: -14, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5 * D, ease: 'back.out(1.6)' }); box.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); return; } }
        const fr = vis.getBoundingClientRect(), br = box.parentElement.getBoundingClientRect(), bw = Math.min(1360, br.width);
        box.style.setProperty('--tip', Math.max(40, Math.min(bw - 40, fr.left + fr.width / 2 - (br.left + (br.width - bw) / 2))) + 'px');
        if (was < 0) { fill(); box.hidden = false; gsap.fromTo(box, { opacity: 0, y: -14, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5 * D, ease: 'back.out(1.6)' }); if (narrow) box.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); }
        else gsap.to([q, who], { opacity: 0, duration: 0.18 * D, onComplete: () => { fill(); gsap.to([q, who], { opacity: 1, duration: 0.3 * D }); } });
        })); }
    if (s === 'cat') $('#copyMail').addEventListener('click', () => { const t = $('#toast'); (navigator.clipboard ? navigator.clipboard.writeText('naipak.darya.be@gmail.com') : Promise.reject()).then(() => t.textContent = 'Copied. Talk soon!', () => t.textContent = 'naipak.darya.be@gmail.com'); });
  }
  /* a case book opens straight to its pages, in the reader carried over from the first site */
  const reader = $('#reader');
  function openCase(i, from) { if (window.Cases) Cases.open(i, from); }
  let lastFocus = null, opened = null, openedAt = 0;
  function clearGlow() { setHover(null); gsap.killTweensOf(st, 'glow'); st.glow = 0; lastHover = null; hnote.hidden = true; }
  /* "Back to the room" is centred on the title's letters as they appear (from the baseline up to the top of the tall letters), not on the line box, so it lines up whatever the title and screen size */
  const meas = document.createElement('canvas').getContext('2d');
  function alignBack() { if (cu.hidden) return; const t = cuTitle, cs = getComputedStyle(t), bar = $('.cu-bar'); meas.font = cs.font;
    const m = meas.measureText(t.textContent), rg = document.createRange(); rg.selectNodeContents(t); const line = rg.getClientRects()[0]; if (!line) return;
    const pinned = getComputedStyle(cuClose).position === 'fixed', top = bar.offsetTop - (pinned ? cu.scrollTop : 0) + t.offsetTop + (line.top - t.getBoundingClientRect().top), base = top + m.fontBoundingBoxAscent * (line.height / (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent));
    const mid = base - m.actualBoundingBoxAscent / 2; root.style.setProperty('--bt', Math.round(mid - cuClose.offsetHeight / 2) + 'px'); }
  addEventListener('resize', alignBack);
  function open(s) { openedAt = performance.now(); lastFocus = document.activeElement; menuSet(false); clearGlow(); opened = s; const from = secRect(s);
    cu.classList.toggle('noscroll', s === 'pinboard');
    cuTitle.textContent = TITLES[s]; (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(alignBack)); sheet.innerHTML = VIEWS[s](); cu.hidden = false; cu.scrollTop = 0; document.body.style.overflow = 'hidden';
    wire(s); gsap.to('.intro', { opacity: 0, x: -30, duration: 0.5 * D }); requestAnimationFrame(() => enter(s, from)); cuClose.focus({ preventScroll: true });
    document.querySelectorAll('[data-go]').forEach(b => b.setAttribute('aria-current', String(b.dataset.go === s))); }
  function back() { if (!reader.hidden) $('#closeBook').click(); if (cu.hidden) return; clearGlow(); const s = opened, to = secRect(s), t = sheet.firstElementChild;
    const r = t.getBoundingClientRect();
    gsap.timeline({ onComplete: () => { cu.hidden = true; sheet.innerHTML = ''; gsap.set([t], { clearProps: 'all' }); document.body.style.overflow = ''; } })
      .to(t, { x: to.x + to.w / 2 - (r.left + r.width / 2), y: to.y + to.h / 2 - (r.top + r.height / 2), scale: Math.max(0.06, Math.min(to.w / r.width, to.h / r.height)), opacity: 0, duration: 0.6 * D, ease: 'power3.in' }, 0)
      .to('#scrim', { opacity: 0, duration: 0.5 * D }, 0.15 * D).to(['.cu-bar', '#cuClose'], { opacity: 0, duration: 0.3 * D }, 0);
    gsap.to('.intro', { opacity: 1, x: 0, duration: 0.6 * D, delay: 0.3 * D });
    document.querySelectorAll('[data-go]').forEach(b => b.removeAttribute('aria-current')); if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true }); }
  /* a phone sends its click a moment after the tap that opened the section: ignore background taps right after opening */
  cuClose.addEventListener('click', back); $('#scrim').addEventListener('click', () => { if (performance.now() - openedAt > 500) back(); });
  addEventListener('keydown', e => { if (!reader.hidden || !$('#player').hidden || !$('#viewer').hidden) return; if (e.key === 'Escape') back();
    if (e.key === 'Tab' && !cu.hidden) { const f = [...cu.querySelectorAll('button, a[href]')].filter(x => x.offsetParent); if (!f.length) return; const a = f[0], z = f[f.length - 1];
      if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } } });
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => open(b.dataset.go)));

  /* ---------- entrance ---------- */
  gsap.from('.intro > *', { opacity: 0, y: 24, stagger: 0.09, duration: reduce ? 0 : 1.0, ease: 'power3.out', delay: 0.15 });
  gsap.from(canvas, { opacity: 0, scale: 0.96, duration: reduce ? 0 : 1.4, ease: 'power3.out', delay: 0.2 });
  gsap.from('.top > *', { opacity: 0, y: -10, stagger: 0.08, duration: 0.6, delay: 0.5, clearProps: 'transform,opacity' });
  resize();
  window.__room = { open, back, setMode, frame: f => { target = f; st.f = f; }, hover: s => setHover(s), openCase };
})();
